<!-- Public pages: no shell -->
<ng-container *ngIf="!showShell(); else shell">
  <router-outlet />
</ng-container>

<!-- Authenticated shell with sidebar -->
<ng-template #shell>
  <nav class="topbar">
    <div class="topbar-brand">
      <button class="sidebar-toggle" (click)="sidebarCollapsed = !sidebarCollapsed">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <img src="assets/logo/iovision-logo.png" alt="IoHire" class="topbar-logo" />
      <span class="topbar-title">IoHire</span>
    </div>
    <div class="topbar-end" *ngIf="authService.currentUser$ | async as user">
      <span class="username">{{ user.username }}</span>
      <button (click)="logout()" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        {{ i18n.t('nav.logout') }}
      </button>
    </div>
  </nav>

  <div class="app-body">
    <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </span>
          <span class="nav-label">{{ i18n.t('nav.dashboard') }}</span>
        </a>
        <a routerLink="/skills" routerLinkActive="active">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          </span>
          <span class="nav-label">{{ i18n.t('nav.skills') }}</span>
        </a>
        <a routerLink="/departments" routerLinkActive="active">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </span>
          <span class="nav-label">{{ i18n.t('nav.departments') }}</span>
        </a>
        <a routerLink="/job-postings" routerLinkActive="active">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </span>
          <span class="nav-label">{{ i18n.t('nav.jobPostings') }}</span>
        </a>
        <a routerLink="/candidates" routerLinkActive="active">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </span>
          <span class="nav-label">Candidates</span>
        </a>
      </nav>

      <!-- Language toggle -->
      <div class="lang-toggle-wrapper">
        <div class="lang-toggle" (click)="i18n.toggle()" [class.en]="i18n.lang === 'en'">
          <span class="lang-label" [class.active]="i18n.lang === 'fr'">FR</span>
          <span class="lang-slider"></span>
          <span class="lang-label" [class.active]="i18n.lang === 'en'">EN</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</ng-template>
