<div class="departments-page">
    <div class="page-header">
        <div>
            <h1><strong>{{ i18n.t('dept.title') }}</strong></h1>
            <p class="muted">{{ i18n.t('dept.subtitle') }}</p>
        </div>
     
        <a routerLink="/dashboard" class="back-link">{{ i18n.t('dept.backToDashboard') }}</a>
    </div>

    <!-- Messages -->
    <div class="alert error" *ngIf="error">
        {{ error }}
        <button (click)="error = ''">&times;</button>
    </div>
    <div class="alert success" *ngIf="success">
        {{ success }}
        <button (click)="success = ''">&times;</button>
    </div>

    <!-- Remplacez les lignes de recherche et d'ajout par ceci -->
    <div class="search-add-container">
        <!-- Barre d'ajout -->
        <div class="add-row">
            <input type="text" [(ngModel)]="newName" [placeholder]="i18n.t('dept.placeholder')"
                (keyup.enter)="addDepartment()" />
            <button class="btn-add" (click)="addDepartment()" [disabled]="!newName.trim()">{{ i18n.t('dept.add') }}</button>
        </div>

        <!-- Barre de recherche (autocomplete) à droite -->
        <div class="search-row">
            <app-department-autocomplete [placeholder]="i18n.t('dept.searchPlaceholder')" (searchResults)="onSearch($event)"
                (searchCleared)="onSearchCleared()" (departmentSelected)="onDepartmentPicked($event)">
            </app-department-autocomplete>
        </div>
    </div>
    <!-- Liste -->
    <p class="center" *ngIf="loading">{{ i18n.t('dept.loading') }}</p>
    <p class="center" *ngIf="!loading && filteredDepartments.length === 0 && departments.length === 0">
        {{ i18n.t('dept.empty') }}
    </p>
    <p class="center" *ngIf="!loading && filteredDepartments.length === 0 && departments.length > 0">
        {{ i18n.t('dept.noResults') }}
    </p>

    <div class="list" *ngIf="!loading && filteredDepartments.length > 0">
        <div class="row" *ngFor="let dept of filteredDepartments">
            <!-- Mode visualisation -->
            <ng-container *ngIf="editingId !== dept.documentId">
                <span class="name">{{ dept.name }}</span>
                <div class="actions">
                    <button class="btn-edit" (click)="startEdit(dept)">{{ i18n.t('dept.edit') }}</button>
                    <button class="btn-delete" (click)="deleteDepartment(dept)">{{ i18n.t('dept.delete') }}</button>
                </div>
            </ng-container>

            <!-- Mode édition -->
            <ng-container *ngIf="editingId === dept.documentId">
                <input type="text" [(ngModel)]="editName" (keyup.enter)="saveEdit()" class="edit-input" />
                <div class="actions">
                    <button class="btn-save" (click)="saveEdit()" [disabled]="!editName.trim()">{{ i18n.t('dept.save') }}</button>
                    <button class="btn-cancel" (click)="cancelEdit()">{{ i18n.t('dept.cancel') }}</button>
                </div>
            </ng-container>
        </div>
    </div>
</div>
