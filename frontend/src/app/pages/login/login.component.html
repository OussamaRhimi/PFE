<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">AI Hiring Platform</h1>
      <h2 class="login-subtitle">Login</h2>

      <div *ngIf="error" class="alert alert-danger" role="alert">
        <strong>Error:</strong> {{ error }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="identifier" class="form-label">Email or Username</label>
          <input
            type="text"
            class="form-control"
            id="identifier"
            formControlName="identifier"
            placeholder="Enter your email or username"
            [class.is-invalid]="submitted && f['identifier'].errors"
          />
          <div *ngIf="submitted && f['identifier'].errors" class="invalid-feedback">
            Email or username is required
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [class.is-invalid]="submitted && f['password'].errors"
          />
          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <hr class="my-4" />

      <p class="text-center text-muted">
        Don't have an account? <a href="/register" class="register-link">Register here</a>
      </p>
    </div>
  </div>
</div>
