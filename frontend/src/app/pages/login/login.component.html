<div class="login-wrapper">

  <!-- Animated background orbs -->
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
  </div>

  <!-- Floating micro-particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Login Card -->
  <div class="login-card">

    <!-- Header -->
    <div class="card-header">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <img [src]="logoPath" alt="IoHire Logo" class="brand-logo">
      </div>
      <h1 class="brand-title">
        <span class="brand-line">{{ i18n.t('login.welcomeTo') }}</span>
        <span class="brand-highlight">IoHire</span>
      </h1>
      <p class="form-subtitle">{{ i18n.t('login.subtitle') }}</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="alert alert-error">
      <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
      <span>{{ error }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Identifier -->
      <div class="form-group">
        <label for="identifier" class="form-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          {{ i18n.t('login.identifier') }}
        </label>
        <div class="input-wrapper">
          <input type="text" class="form-input" id="identifier" formControlName="identifier"
            [placeholder]="i18n.t('login.identifierPlaceholder')" [class.error]="submitted && f['identifier'].errors"
            autocomplete="username" />
          <div class="input-border"></div>
        </div>
        <div *ngIf="submitted && f['identifier'].errors" class="field-error">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
          </svg>
          {{ i18n.t('login.required') }}
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" />
          </svg>
          {{ i18n.t('login.password') }}
        </label>
        <div class="input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" class="form-input" id="password" formControlName="password"
            placeholder="••••••••" [class.error]="submitted && f['password'].errors" autocomplete="current-password" />
          <div class="input-border"></div>
          <!-- Password visibility toggle -->
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="field-error">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
          </svg>
          <span *ngIf="f['password'].errors['required']">{{ i18n.t('login.required') }}</span>
          <span *ngIf="f['password'].errors['minlength']">{{ i18n.t('login.minLength') }}</span>
        </div>
      </div>

      <!-- Remember me / Forgot password -->
      <div class="form-options">
        <label class="checkbox-wrapper">
          <input type="checkbox" />
          <span class="checkbox-custom"></span>
          <span class="checkbox-label">{{ i18n.t('login.rememberMe') }}</span>
        </label>
        <a href="/forgot-password" class="link-forgot">{{ i18n.t('login.forgotPassword') }}</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" [disabled]="loading" [class.loading]="loading">
        <span class="btn-content" *ngIf="!loading">
          <span>{{ i18n.t('login.submit') }}</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </span>
        <span class="btn-loader" *ngIf="loading">
          <span class="spinner"></span>
          <span>{{ i18n.t('login.loading') }}</span>
        </span>
      </button>



    </form>



  </div>
</div>
